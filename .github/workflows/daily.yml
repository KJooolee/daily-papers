name: HF Daily Papers Digest

on:
  schedule:
    # 평일(월~금) 08:00 KST = UTC 23:00 (일~목). cron 요일: 0=일 ... 6=토
    - cron: "0 23 * * 0-4"
    # 주말 리셋: 토요일 09:00 KST = 토 00:00 UTC. 확인 기록 초기화.
    - cron: "0 0 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (digest 또는 reset)"
        required: false
        default: "digest"

# seen_papers.json 커밋을 위해 쓰기 권한 필요
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide run mode
        id: mode
        run: |
          # 수동 실행이면 입력값, 스케줄이면 트리거된 cron으로 모드 결정
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * 6" ]; then
            echo "mode=reset" >> "$GITHUB_OUTPUT"
          else
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_KEY: ${{ secrets.HF_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TOP_N: "15"
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: python digest.py

      - name: Commit seen_papers.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_papers.json
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "update seen papers ($(date -u +%Y-%m-%d))"
            git push
          fi
